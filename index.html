<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Notes | Premium Dictation Tool</title>
    <meta name="description" content="A premium, real-time voice-to-text dictation tool built with the Web Speech API.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- APP HEADER: Branding, Language, and Theme Controls -->
        <header class="app-header" role="banner">
            <div class="header-brand">
                <div class="waveform" id="visualizer" aria-hidden="true">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
                <h1>Voice Notes</h1>
                <select id="lang-select" class="select-field" aria-label="Select dictation language">
                    <option value="en-US">English (US)</option>
                    <option value="hi-IN">हिन्दी (Hindi)</option>
                </select>
            </div>
            <div class="header-meta">
                <time id="live-time" aria-label="Current time">--:-- --</time>
                <button id="theme-toggle" class="btn btn-icon" aria-label="Toggle light/dark theme" title="Toggle Theme">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sun-icon"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
        </header>

        <!-- TOOLBAR: Core Actions and Statistics -->
        <section class="toolbar" role="toolbar" aria-label="Editor actions">
            <div class="toolbar-actions">
                <button id="btn-toggle" class="btn btn-primary" aria-pressed="false">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    <span id="toggle-text">Stop Listening</span>
                </button>
                <div class="toolbar-divider" aria-hidden="true"></div>
                <button id="btn-copy" class="btn" aria-label="Copy transcript to clipboard">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy
                </button>
                <button id="btn-download" class="btn" aria-label="Download transcript as text file">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download
                </button>
                <button id="btn-clear" class="btn btn-danger" aria-label="Clear all notes">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Clear
                </button>
            </div>
            <div class="toolbar-stats" aria-live="polite">
                <span id="word-count">0 words</span>
                <span class="divider" aria-hidden="true">•</span>
                <span id="char-count">0 chars</span>
            </div>
        </section>

        <!-- MAIN EDITOR: Interactive Transcript Area -->
        <main class="editor-surface" id="editor-container" role="main">
            <div id="empty-state" class="empty-state">
                <div class="empty-icon" aria-hidden="true">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                </div>
                <h2>Ready for your voice...</h2>
                <p>Start speaking to create a note. Your thoughts will appear here in real-time.</p>
            </div>
            <div id="transcript-box" 
                 class="transcript-box" 
                 spellcheck="false" 
                 contenteditable="true" 
                 role="textbox" 
                 aria-multiline="true" 
                 aria-label="Dictation transcript area">
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
